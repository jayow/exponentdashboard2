[project]
name = "exponent-dashboard-v2"
version = "0.1.0"
description = "ELT pipeline + dashboard for Exponent Finance analytics"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "python-dotenv>=1.0.0",
    "base58>=2.1.1",
    "pydantic>=2.8.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
