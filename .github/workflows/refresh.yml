name: Daily Dashboard Refresh

on:
  # Daily refresh is triggered by a launchd agent on Jake's Mac at 8 AM Manila
  # (00:00 UTC) via `gh workflow run refresh.yml`. GHA's own `schedule:` was
  # unreliable on this repo (never fired across 2 days of attempts), so we
  # drive it externally and keep this workflow purely dispatch-based.
  workflow_dispatch:

# Avoid concurrent runs trampling the same git push.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 180: 60 was outgrown (cancelled at 1h from 2026-07-03); then the
    # 2026-07-08 429-hardening (gPA throttle + extra retries) slowed runs
    # enough to hit 120 too. Reverted the throttle below; 180 leaves margin
    # for Helius 429 retry loops without the run getting killed mid-commit.
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install dbt deps
        working-directory: transform
        run: dbt deps

      # ── Restore cached warehouse_slim.duckdb ─────────────────────────
      # Cache key uses run_id so each run saves a fresh cache; restore-keys
      # falls back to the most recent prior run. This is the same pattern
      # v1 used (works around GHA cache's "save once" rule).
      - name: Restore warehouse cache
        id: warehouse-cache
        uses: actions/cache/restore@v4
        with:
          path: data/warehouse.duckdb
          key: warehouse-slim-${{ github.run_id }}
          restore-keys: |
            warehouse-slim-

      - name: Seed warehouse from release if cache empty
        if: steps.warehouse-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -f data/warehouse.duckdb ]; then
            echo "Cache miss — downloading warehouse seed from latest release…"
            mkdir -p data
            # Expects a release tagged 'warehouse-seed' with warehouse_slim.duckdb.gz attached
            gh release download warehouse-seed -p 'warehouse_slim.duckdb.gz' -D data/
            gunzip data/warehouse_slim.duckdb.gz
            mv data/warehouse_slim.duckdb data/warehouse.duckdb
            echo "Seeded: $(du -sh data/warehouse.duckdb | cut -f1)"
          else
            echo "Cache hit — using existing data/warehouse.duckdb ($(du -sh data/warehouse.duckdb | cut -f1))"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Configure .env from GHA secrets ──────────────────────────────
      - name: Write .env
        run: |
          cat > .env <<EOF
          SOLANA_RPC_URLS=${{ secrets.SOLANA_RPC_URLS }}
          WAREHOUSE_PATH=data/warehouse.duckdb
          EOF
          # NOTE: an earlier HELIUS_GPA_RPS_CAP=1 here halved gPA throughput
          # and (with 11 retries) pushed runs past the 120-min timeout — they
          # were cancelled mid-run and never committed. Reverted to the
          # default cap (2). Strategy extractors run FIRST (cold key) and the
          # publish guard blocks empty strategy_vault.json, so occasional
          # 429s degrade gracefully instead of needing aggressive throttling.

      # ── Run the refresh pipeline ─────────────────────────────────────
      # Each step is allowed to fail with `|| true` so we can compact +
      # publish whatever was produced. Sanity-check at the end refuses to
      # push if the dashboard JSON looks empty.
      - name: Extract → transform → serve
        run: |
          # Per-extractor failure isolation: one extractor blowing up (e.g.
          # transient Helius 429 burst that exhausts retry budget) should NOT
          # take down the whole refresh. dbt + serve still run on whatever
          # advanced; the failed extractor catches up tomorrow or via a
          # manual `gh workflow run`. Failures surface as ::warning:: lines.
          set +e
          failed=0
          run() {
            name="$1"; shift
            echo "::group::$name"
            "$@"
            rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              echo "::warning::$name exited $rc — continuing with remaining steps"
              failed=$((failed + 1))
            fi
          }
          # Strategy-vault extractors go FIRST: their getProgramAccounts
          # calls are the most 429-prone, so run them while the RPC key is
          # cold rather than after an hour of tx fetching (2026-07-07/08
          # runs 429'd every gPA extractor and emptied prod's Strategies
          # tab). states before obligations/holders; actions after
          # signatures; executions after actions + states.
          run extract_sv_registry     python -m extract_load.extract_strategy_vault_registry
          run extract_sv_states       python -m extract_load.extract_strategy_vault_states
          run extract_sv_obligations  python -m extract_load.extract_strategy_vault_obligations
          run extract_sv_proposals    python -m extract_load.extract_strategy_vault_proposals
          run extract_sv_withdrawals  python -m extract_load.extract_strategy_vault_withdrawals
          run extract_sv_signatures   python -m extract_load.extract_strategy_vault_signatures
          run extract_sv_actions      python -m extract_load.extract_strategy_vault_actions
          run extract_sv_executions   python -m extract_load.extract_strategy_vault_executions
          run extract_sv_holders      python -m extract_load.extract_strategy_vault_holders
          run extract_mint_supplies   python -m extract_load.extract_mint_supplies
          run extract_markets         python -m extract_load.extract_markets
          run extract_signatures      python -m extract_load.extract_signatures
          run extract_transactions    python -m extract_load.extract_transactions
          run extract_token_metadata  python -m extract_load.extract_token_metadata
          run extract_prices          python -m extract_load.extract_prices
          run extract_positions       python -m extract_load.extract_positions
          run extract_pool_state      python -m extract_load.extract_pool_state
          run extract_holders         python -m extract_load.extract_holders
          run extract_anchor_events   python -m extract_load.extract_anchor_events
          # Tranche extractors were only ever in refresh_local.sh (Railway),
          # never here — so the primary GHA pipeline never refreshed tranche
          # data. Prod tranche risk metrics went 11+ days stale (senior NAV
          # understated ~26x). Adding them here; gPA-based so keep them with
          # the other gPA extractors, not at the very end.
          run extract_tranche_states  python -m extract_load.extract_tranche_states
          run extract_tranche_actions python -m extract_load.extract_tranche_actions
          run extract_lst_rates       python -m extract_load.extract_lst_rates
          run extract_v2_markets      python -m extract_load.extract_v2_markets
          run extract_v2_books        python -m extract_load.extract_v2_books
          if [ $failed -gt 0 ]; then
            echo "::warning::$failed extractor(s) failed — dbt + serve will run on partial data"
          fi
          # dbt + serve must still run so partial-fresh data ships. If dbt
          # itself fails (model bug, schema drift), that IS fatal — re-enable
          # set -e for these.
          set -e
          cd transform && DBT_PROFILES_DIR=. dbt build && cd ..
          python -m serve.build_web_data || true
        env:
          PYTHONUNBUFFERED: '1'

      # ── Strip payloads to keep the cache slim ────────────────────────
      - name: Compact warehouse (NULL out raw_helius_tx.payload)
        run: python -m extract_load.compact_in_place

      # ── Sanity-check the dashboard output before committing ──────────
      - name: Validate JSON output
        id: validate
        run: |
          ok=true
          for f in tvl.json users.json market_holders.json; do
            if [ ! -s "web/public/$f" ]; then
              echo "::error::web/public/$f missing or empty"
              ok=false
            fi
          done
          # tvl.json should always have substantial content
          size=$(stat -c %s web/public/tvl.json 2>/dev/null || echo 0)
          if [ "$size" -lt 100000 ]; then
            echo "::error::tvl.json too small ($size bytes) — refusing to publish"
            ok=false
          fi
          # strategy_vault.json must carry vaults — an empty array means the
          # gPA extractors failed (e.g. RPC 429) and publishing would wipe
          # the Strategies tab on prod (happened 2026-07-06..08).
          sv_count=$(python -c "import json; print(len(json.load(open('web/public/strategy_vault.json'))['vaults']))" 2>/dev/null || echo 0)
          if [ "$sv_count" -lt 1 ]; then
            echo "::error::strategy_vault.json has $sv_count vaults — refusing to publish"
            ok=false
          fi
          # Accuracy gate (docs/ACCURACY.md): fast in-warehouse checks. A FAIL
          # means genuinely bad data (negative TVL, broken invariant, decode
          # error, supply-drift blow-out) — refuse to publish. WARNs don't block.
          if ! python -m ops.accuracy_check; then
            echo "::error::accuracy checks FAILED — refusing to publish (see docs/ACCURACY.md)"
            ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          if [ "$ok" != true ]; then
            echo "::error::publish refused — failing the job so this run shows RED instead of silently skipping the commit"
            exit 1
          fi

      # ── Commit refreshed JSON back to the repo ───────────────────────
      - name: Commit + push refreshed JSON
        if: steps.validate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/*.json web/public/strategy-txns/ extract_load/known_vaults.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: daily refresh $(date -u +%Y-%m-%d)"
            # Rebase onto origin before pushing: a bare push fails on a
            # non-fast-forward (e.g. the local/Railway refresh already
            # published today). -X theirs keeps OUR freshly-built JSONs on
            # conflict, same pattern as ops/refresh_local.sh. Two attempts,
            # then warn without failing the job — the pipeline already ran;
            # a lost publish here is recoverable on the next scheduled run.
            pushed=false
            for attempt in 1 2; do
              git fetch -q origin main || true
              git rebase -X theirs FETCH_HEAD >/dev/null 2>&1 || { git rebase --abort 2>/dev/null; break; }
              if git push origin HEAD:${{ github.ref_name }}; then pushed=true; echo "Pushed."; break; fi
            done
            if [ "$pushed" != true ]; then
              echo "::warning::push failed after rebase+retry — main moved again or auth issue. Publish skipped this run."
            fi
          fi

      # ── Save warehouse cache (always, even on failure/refusal) ───────
      # A validate failure now exits the job RED (see above), which skips
      # steps by default — this needs if: always() so today's extracted
      # warehouse progress is preserved for tomorrow's run instead of being
      # thrown away along with the red X.
      - name: Save warehouse cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/warehouse.duckdb
          key: warehouse-slim-${{ github.run_id }}
