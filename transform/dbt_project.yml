name: exponent_dashboard
version: 0.1.0
config-version: 2

profile: exponent_dashboard

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: target
clean-targets:
  - target
  - dbt_packages
  - logs

models:
  exponent_dashboard:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      core:
        +materialized: table
        +schema: core
      analytics:
        +materialized: table
        +schema: analytics
