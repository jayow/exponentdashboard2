version: 2

models:
  - name: stg_helius_tx
    description: >
      Typed projection of raw_helius_tx. Lifts hot JSON sub-trees out as
      typed columns so downstream models don't re-traverse the same JSON.
    columns:
      - name: signature
        tests: [unique, not_null]
      - name: block_time
        tests: [not_null]

  - name: stg_inner_ix
    description: >
      One row per inner instruction across all txs. ~13.1M rows from 562K
      txs (≈23 inner ix avg per tx). Materialized as a table — downstream
      marts hit this often and UNNEST per query is expensive.
    columns:
      - name: signature
        tests: [not_null]
      - name: outer_ix_index
        tests: [not_null]
      - name: inner_ix_index
        tests: [not_null]
      - name: program_id
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - signature
            - outer_ix_index
            - inner_ix_index

  - name: stg_token_changes
    description: >
      Per-tx, per-(account_index, mint, owner) token balance deltas.
      ~2.9M rows from 513K txs (≈5.7 deltas per tx). delta_raw = post -
      pre, treating missing as 0. Rows with delta_raw=0 are filtered out.
    columns:
      - name: signature
        tests: [not_null]
      - name: account_index
        tests: [not_null]
      - name: mint
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - signature
            - account_index
            - mint
            - owner

  - name: stg_markets
    description: Cleaned + typed market dim, unioning api + onchain sources.

  - name: stg_prices
    description: Daily underlying USD prices, typed projection of raw_prices.
