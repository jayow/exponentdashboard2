version: 2

sources:
  - name: raw
    description: Raw extract from Helius RPC + Exponent API. Immutable, append-only.
    schema: main
    tables:
      - name: raw_helius_tx
        description: Full jsonParsed tx payloads keyed by signature.
        columns:
          - name: signature
            tests: [unique, not_null]
          - name: block_time
            tests: [not_null]
          - name: payload
            tests: [not_null]

      - name: raw_signatures
        description: Discovered tx signatures per Exponent-related address.
        columns:
          - name: signature
            tests: [unique, not_null]
          - name: address
            tests: [not_null]

      - name: raw_markets
        description: Market metadata, sourced from Exponent API and on-chain. Composite PK (market_key, source).
        columns:
          - name: market_key
            tests: [not_null]
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: ['api', 'onchain']

      - name: raw_prices
        description: Daily USD prices for tracked underlyings.

      - name: raw_holders
        description: Daily holder snapshots per PT/YT/LP mint.

      - name: raw_positions
        description: YieldTokenPosition + LpPosition Anchor accounts (per user, per market). Owner field at offset 8 is the user wallet; vault field links to dim_markets.vault.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: leg
            tests:
              - not_null
              - accepted_values:
                  values: ['YT', 'LP']
          - name: position_account
            tests: [not_null]

      - name: raw_tvl_snapshots
        description: Daily on-chain TVL — underlying balance held by each market PDA.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: market_key
            tests: [not_null]

      - name: raw_pool_state
        description: Daily AMM pool reserves (SY, PT) + LP supply per market.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: market_key
            tests: [not_null]

      - name: raw_lst_rates
        description: Daily LST→base exchange rates from on-chain stake pool accounts.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: lst_mint
            tests: [not_null]

      - name: raw_token_metadata
        description: Helius DAS Metaplex token metadata, keyed by mint.
        columns:
          - name: mint
            tests: [unique, not_null]

      - name: raw_exponent_tokens
        description: Exponent /tokens endpoint snapshot. Underlying token universe.
        columns:
          - name: mint
            tests: [unique, not_null]
