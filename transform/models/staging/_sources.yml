version: 2

sources:
  - name: raw
    description: Raw extract from Helius RPC + Exponent API. Immutable, append-only.
    schema: main
    tables:
      - name: raw_helius_tx
        description: Full jsonParsed tx payloads keyed by signature.
        columns:
          - name: signature
            tests: [unique, not_null]
          - name: block_time
            tests: [not_null]
          - name: payload
            # No not_null test: compact_in_place NULLs payloads older than
            # the dbt incremental window by design. The data is recoverable
            # by re-fetching, but the row is kept so signatures stay unique.

      - name: raw_signatures
        description: Discovered tx signatures per Exponent-related address.
        columns:
          - name: signature
            tests: [unique, not_null]
          - name: address
            tests: [not_null]

      - name: raw_markets
        description: Market metadata, sourced from Exponent API and on-chain. Composite PK (market_key, source).
        columns:
          - name: market_key
            tests: [not_null]
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: ['api', 'onchain']

      - name: raw_prices
        description: Daily USD prices for tracked underlyings.

      - name: raw_holders
        description: Daily holder snapshots per PT/YT/LP mint.

      - name: raw_positions
        description: YT / LP / LP_CLMM Anchor positions. Owner = user wallet at offset 8. vault depends on leg — see load.py for layout.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: leg
            tests:
              - not_null
              - accepted_values:
                  values: ['YT', 'LP', 'LP_CLMM']
          - name: position_account
            tests: [not_null]

      - name: raw_vault_states
        description: Daily snapshot of Exponent Vault account fields needed for unstaged-yield computation (final_sy_exchange_rate, last_seen_sy_rate). Decoded from Vault accounts (disc d308e82b02987577 in core program).
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: vault
            tests: [not_null]

      - name: raw_market_three_states
        description: Per-CLMM-market state for unclaimed-yield computation. lp_farm.farm_emissions[0] details + financials.liquidity_balance + ticks_account pointer.

      - name: raw_clmm_ticks
        description: Per-active-tick (slot, apy_bp, spot_price, fee_growth_outside_pt/sy) snapshot from each CLMM market's Ticks PDA. Powers Uniswap V3 fee_growth_inside computation.

      - name: raw_clmm_lp_share_trackers
        description: Per-LP-position share-tracker rows decoded from CLMM PositionAccount.share_trackers vec. Each row carries (position_account, share_idx, tick_idx, right_tick_idx, lp_share). Powers SDK withdrawLiquidity USD valuation.

      - name: raw_clmm_market_globals
        description: Per-CLMM-market global fee_growth + current tick snapshot (Ticks PDA footer).

      - name: raw_clmm_markets
        description: CLMM market accounts (disc f2f01a0f94bab9cd) → pt_mint mapping.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: clmm_market
            tests: [not_null]

      - name: raw_market_two_pools
        description: Every MarketTwo account on-chain (no dedup), with decoded financials. Multiple pools per market when migrations exist.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: pool_account
            tests: [not_null]

      - name: raw_anchor_position_events
        description: Anchor YT/LP position-mutating events parsed from raw_helius_tx logMessages. See extract_load/extract_anchor_events.py.
        columns:
          - name: signature
            tests: [not_null]
          - name: log_index
            tests: [not_null]
          - name: program_id
            tests: [not_null]
          - name: instruction_name
            tests: [not_null]
          - name: leg
            tests:
              - not_null
              - accepted_values:
                  values: ['YT', 'LP']

      - name: raw_tvl_snapshots
        description: Daily on-chain TVL — underlying balance held by each market PDA.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: market_key
            tests: [not_null]

      - name: raw_pool_state
        description: One row per Exponent AMM pool account (= per SY mint). pool_account is the XP1BRLn8 program PDA that authorities the SY-reserves token account; sy_mint at offset 8.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: pool_account
            tests: [not_null]
          - name: sy_mint
            tests: [not_null]

      - name: raw_token_metadata
        description: Helius DAS Metaplex token metadata, keyed by mint.
        columns:
          - name: mint
            tests: [unique, not_null]

      - name: raw_exponent_tokens
        description: Exponent /tokens endpoint snapshot. Underlying token universe.
        columns:
          - name: mint
            tests: [unique, not_null]

      - name: raw_v2_markets
        description: v2 (XPBook) market discovery — one row per market account.
        columns:
          - name: market_account
            tests: [unique, not_null]
          - name: book_account
            tests: [not_null]

      - name: raw_v2_book_snapshots
        description: Daily snapshot of v2 book accounts. One row per (date, book).
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: book_account
            tests: [not_null]

      - name: raw_v2_orders_snapshots
        description: Flattened per-order rows from v2 books. One row per resting offer per snapshot.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: book_account
            tests: [not_null]
          - name: offer_idx
            tests: [not_null]

      - name: raw_lst_rates
        description: |
          Daily LST → base exchange rates pulled directly from on-chain state
          (Solstice GLAM vault, Kamino reserve, Sanctum SPL stake pool, …).
          lst_per_base = LST tokens per 1 base token; so lst_usd = base_usd / lst_per_base.
        columns:
          - name: snapshot_date
            tests: [not_null]
          - name: lst_mint
            tests: [not_null]
          - name: base_mint
            tests: [not_null]
          - name: lst_per_base
            tests: [not_null]
